# Host Nginx gateway: containers stay on loopback; one public port serves both roles.
# Install a password file at /etc/nginx/creator-review.htpasswd before enabling.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 0;
    client_body_timeout 600s;
    auth_basic "Creator Review";
    auth_basic_user_file /etc/nginx/creator-review.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Provision this root-owned include with the same token as the API environment.
    include /etc/nginx/creator-review-gateway.conf;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;

    location = /healthz { auth_basic off; access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /creator { proxy_pass http://127.0.0.1:8081; }
    location ^~ /creator/ { proxy_pass http://127.0.0.1:8081; }
    # The two role builds have separate entry chunks; common hashed assets are identical.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_intercept_errors on;
        error_page 404 = @creator_assets;
    }
    location @creator_assets { proxy_pass http://127.0.0.1:8081; }
    location / { proxy_pass http://127.0.0.1:8080; }
}
