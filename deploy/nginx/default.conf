server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/brand;
    index index.html;
    client_max_body_size 0;
    client_body_timeout 600s;
    include /etc/nginx/review-api.conf;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/creator;
    index index.html;
    client_max_body_size 0;
    client_body_timeout 600s;
    include /etc/nginx/review-api.conf;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
